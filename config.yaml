project:
  name: Pronóstico de demanda eléctrica del SIP de Misiones
  random_seed: 42
dataset:
  input_file_sarimax: data/processed/demandas_horarias_2023_2026[sarimax].csv
  input_file_lstm: data/processed/demandas_horarias_2023_2026[lstm].csv
  input_file_lightgbm: data/processed/demandas_horarias_2023_2026[lightgbm].csv
  input_file_chronos2: data/processed/demandas_horarias_2023_2026[chronos2].csv
  datetime:
    date_column: FECHA
    hour_column: Horario
    frequency: 1h
  target: TOTAL_SIP
  period:
    start: '2023-01-01 00:00:00'
    end: '2026-01-01 23:00:00'
  exogenous_candidates:
    - TEMP
    - HUM
    - es_laboral
    - dia_semana
split:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
backtesting:
  forecast_horizon: 3
  stride: 3
  context_window: 168
  retrain: false
  last_points_only: false
horizons:
  - 24
  - 3
  - 6
  - 12
optimization:
  study_name: forecasting
  direction: minimize
  metric: rmse
  trials_sarimax: 120
  trials_lstm: 100
  trials_lightgbm: 150
  trials_chronos2: 50
  timeout_seconds:
  n_startup_trials: 30
  sampler: TPESampler
  pruner: MedianPruner
metrics:
  primary: rmse
  report:
    - mae
    - rmse
    - mape
    - smape
    - r2
sarimax:
  seasonal_period: 24
  method: CSS
  maxiter: 125
  initialization: diffuse
  enforce_stationarity: false
  enforce_invertibility: false
  features:
    fixed:
      horario:
        flag: use_hora_ciclica
        features:
          - hora_sin
          - hora_cos
    candidates_group:
      dia_semana:
        flag: use_dia_semana
        features:
          - dia_semana_sin
          - dia_semana_cos
      dia_anio:
        flag: use_dia_anio
